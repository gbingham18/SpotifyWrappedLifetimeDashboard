<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Longplay: an LP record in the app palette -->
  <rect width="64" height="64" rx="14" fill="#0E0D0B"/>
  <!-- disc -->
  <circle cx="32" cy="32" r="23" fill="#15130F" stroke="#F2EDDF" stroke-width="2.5"/>
  <!-- grooves -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#F2EDDF" stroke-width="1.4" opacity="0.35"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#F2EDDF" stroke-width="1.4" opacity="0.2"/>
  <!-- label -->
  <circle cx="32" cy="32" r="9" fill="#66D46E"/>
  <!-- spindle hole -->
  <circle cx="32" cy="32" r="2.6" fill="#0E0D0B"/>
</svg>
