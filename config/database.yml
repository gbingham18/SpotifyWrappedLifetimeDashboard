default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: spotifywrapped_development
  username: <%= ENV.fetch("PGUSER", "grantbingham") %>
  password: <%= ENV.fetch("PGPASSWORD", "") %>
  host: localhost

test:
  <<: *default
  database: spotifywrapped_test
  username: <%= ENV.fetch("PGUSER", "grantbingham") %>
  password: <%= ENV.fetch("PGPASSWORD", "") %>
  host: localhost

production:
  <<: *default
  database: spotify_wrapped_production
  username: spotify_wrapped
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: spotify_wrapped-db
  port: 5432
