service: spotify_wrapped
image: gbingham18/spotify_wrapped

servers:
  web:
    hosts:
      - 204.48.30.161
  worker:
    hosts:
      - 204.48.30.161
    cmd: bundle exec sidekiq

proxy:
  ssl: false
  app_port: 3000

registry:
  username: gbingham18
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - REDIS_URL
    - SPOTIFY_CLIENT_ID
    - SPOTIFY_CLIENT_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - AWS_BUCKET
  clear:
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "spotify_wrapped_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: 204.48.30.161
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_DB: spotify_wrapped_production
        POSTGRES_USER: spotify_wrapped
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: 204.48.30.161
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data
